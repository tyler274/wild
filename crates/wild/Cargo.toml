[package]
name = "wild-linker"
description = "A very fast linker for Linux"
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
autotests = false

[[bin]]
name = "wild"
path = "src/main.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
harness = false

[dependencies]
libwild = { path = "../libwild", version = "0.10.0", default-features = false }

dhat = { workspace = true, optional = true }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
# Default process allocator (mimalloc-rs). Disable with
# `--no-default-features --features fork,plugins,zstd`.
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
ar.workspace = true
bitflags.workspace = true
blake3.workspace = true
diff.workspace = true
itertools.workspace = true
foldhash.workspace = true
gimli.workspace = true
hex.workspace = true
linker-diff.path = "../linker-diff"
linker-layout.path = "../linker-layout"
libloading.workspace = true
libtest-mimic = { workspace = true }
object.workspace = true
wasmparser.workspace = true
os_info.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde-keyvalue = { workspace = true }
strum.workspace = true
tempfile.workspace = true
toml.workspace = true
which.workspace = true

[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
wait-timeout.workspace = true

[features]
default = ["fork", "plugins", "zstd", "mimalloc"]

fork = ["libwild/fork"]

zstd = ["libwild/zstd"]

plugins = ["libwild/plugins"]

perfetto = ["libwild/perfetto"]

wasm = ["libwild/wasm"]

macho = ["libwild/macho"]

# Statically embed mimalloc-rs (on by default). Mutually exclusive with
# `mimalloc-dynamic` and `dhat`.
mimalloc = ["dep:mimalloc"]

# Dynamically link libmimalloc.so. Mutually exclusive with `mimalloc` and `dhat`.
# Use `--no-default-features --features fork,plugins,zstd,mimalloc-dynamic`.
mimalloc-dynamic = []

dhat = ["dep:dhat"]

# external tests
external_tests = ["mold_tests", "lld_tests"]
mold_tests = []
lld_tests = []

[lints]
workspace = true

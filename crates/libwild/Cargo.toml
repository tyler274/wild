[package]
name = "libwild"
description = "A library that provides a fast Linux linker"
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[dependencies]
wild-error = { path = "../wild-error", version = "0.10.0" }
wild-fs = { path = "../wild-fs", version = "0.10.0" }
wild-platform = { path = "../wild-platform", version = "0.10.0" }
wild-args = { path = "../wild-args", version = "0.10.0" }
wild-layout = { path = "../wild-layout", version = "0.10.0" }
wild-wasm = { path = "../wild-wasm", version = "0.10.0" }
wild-macho = { path = "../wild-macho", version = "0.10.0" }
wild-elf = { path = "../wild-elf", version = "0.10.0" }
wild-scripts = { path = "../wild-scripts", version = "0.10.0" }
wild-util = { path = "../wild-util", version = "0.10.0" }
anyhow.workspace = true
colosseum.workspace = true
crossbeam-queue.workspace = true
crossbeam-utils.workspace = true
foldhash.workspace = true
hashbrown.workspace = true
itertools.workspace = true
memchr.workspace = true
object.workspace = true
perfetto-recorder.workspace = true
rayon.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zerocopy.workspace = true

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
perf-event.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = ["zstd"]

# Support for running the linker as a subprocess.
fork = []

# Support for linker-plugins.
plugins = ["wild-layout/plugins", "wild-elf/plugins"]

# Enable support for emitting a perfetto trace.
perfetto = ["perfetto-recorder/enable", "tracing/release_max_level_info"]

# Enable work-in-progress features
wip = []

# Experimental support for linking WebAssembly. Currently incomplete.
wasm = []

# Experimental support for linking Mach-O. Currently incomplete.
macho = []

# Support for zstd compression and decompression of sections.
zstd = ["wild-elf/zstd"]

[lints]
workspace = true
